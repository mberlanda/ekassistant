[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekassistant"
version = "0.1.0"
description = "Enterprise Knowledge Assistant - grounded, cited Q&A over internal sources with ACL-aware retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mauro Berlanda" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "ollama>=0.4",
    "rich>=13.9",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ekassistant-api = "ekassistant.api.main:run"
ekassistant-tui = "ekassistant.tui.app:run"
ekassistant-ingest = "ekassistant.ingest.cli:run"
ekassistant-eval = "ekassistant.observability.eval_cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ekassistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
