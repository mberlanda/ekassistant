# Run via OrbStack (or any Docker Engine-compatible runtime): `make up`.
# See docs/decisions/0005-vector-and-keyword-store-choice.md for why only
# the vector store is containerized - the keyword index (SQLite FTS5) is
# embedded and needs no service of its own.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # HTTP + gRPC-web API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
